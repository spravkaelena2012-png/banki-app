:root{--bg:#FAF8F5;--gold:#C8A21A;--ink:#242424;--line:#E9E4DC}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}main{max-width:560px;margin:auto;padding:36px 22px 32px}header{text-align:center}.portrait{width:100px;height:100px;object-fit:cover;object-position:center 24%;border-radius:50%;border:2px solid var(--gold);margin:0 auto 20px;display:block}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:700;color:#A48608}.name{font-size:clamp(32px,8vw,43px);line-height:1.13;letter-spacing:-1.1px;margin:14px 0 10px}.role{font-size:13px;color:#777;line-height:1.6;margin:0 auto 25px}.panel{background:#fff;border:1px solid var(--line);border-radius:19px;padding:23px 21px;margin-bottom:20px;box-shadow:0 6px 22px rgba(40,30,15,.025)}.about{font-size:14px;line-height:1.75;color:#505050;white-space:pre-line}.section-title{font-size:24px;line-height:1.2;letter-spacing:-.6px;margin:10px 0 9px;font-weight:700;text-transform:none}.section-title span{font-family:inherit;font-size:.88em;font-weight:inherit;line-height:inherit;letter-spacing:inherit;text-transform:none;vertical-align:baseline}.muted{color:#777;font-size:13px;line-height:1.6}.progress{height:4px;background:#EEEAE2;border-radius:4px;margin:22px 0}.progress>div{height:100%;background:var(--gold);border-radius:4px;transition:width .2s}.question{font-size:19px;font-weight:700;line-height:1.35;margin:0 0 16px}.options{display:grid;gap:9px}.option{background:#fff;border:1px solid #DDD9D2;border-radius:12px;padding:14px 15px;text-align:left;font-size:14px;color:var(--ink);cursor:pointer}.option.selected{border-color:#C8A21A;background:#FFF6D8;color:#242424;box-shadow:inset 0 0 0 1px rgba(200,162,26,.18)}.controls{display:flex;gap:10px;margin-top:18px}.btn{border:0;border-radius:12px;padding:15px 18px;font-weight:700;font-size:14px;cursor:pointer;text-align:center;text-decoration:none;display:block}.primary{background:#242424;color:#fff;flex:1}.secondary{background:#fff;color:#555;border:1px solid #E8E4DC}.btn:disabled{opacity:.4;cursor:default}.help{margin-top:14px;background:#FAF8F3;border-radius:12px;padding:15px;font-size:13px;line-height:1.65;color:#555}.help strong{display:block;color:#222;margin-bottom:6px}.summary{font-size:14px;line-height:1.75}.summary div{border-bottom:1px solid #eee;padding:7px 0}.cta{background:#242424;color:white;border-radius:19px;padding:25px 22px;margin-top:22px}.cta .eyebrow{color:#D9BE4A}.cta h2{font-size:18px;line-height:1.45;margin:0 0 14px;text-align:center;font-weight:700}.cta p{font-size:13px;line-height:1.5;color:#D8D8D8;text-align:center;margin:0 0 14px}.cta .btn{background:#E0BC39;color:#171717;margin-top:0;width:100%;text-align:center}.notice{font-size:12px;color:#D2CFC7;margin-top:12px;text-align:center}footer{text-align:center;color:#999;font-size:12px;margin-top:34px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
 .custom-input{width:100%;margin-top:11px;border:1px solid #D7D1C5;border-radius:12px;padding:14px 13px;font:inherit;font-size:15px;background:#fff;color:#242424}.custom-input:focus{outline:2px solid #D4A900;outline-offset:1px}.result-cta{background:#E0BC39;color:#171717;width:100%;margin-top:16px}.result-note{text-align:center;font-size:12px;color:#777;margin:10px 0 0}.quiz-stat{font-weight:700;font-size:17px;color:#252525;margin:12px 0 8px;width:100%;line-height:1.6;text-align:left}.quiz-stat-line{display:flex;align-items:baseline;gap:8px;white-space:normal}.quiz-stat-line::before{content:"";display:block;flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:#D63B36;align-self:center}.result-done{display:flex;align-items:center;justify-content:center;gap:8px;color:#E0BC39;font-size:12px;font-weight:700;margin-bottom:15px}.result-check{border:1px solid #E0BC39;border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center}.result-safe{color:#D2CFC7;text-align:center;font-size:11px;line-height:1.5;margin-top:14px}.result-help-link{display:block;margin:14px auto 0;background:none;border:0;color:#E0BC39;text-decoration:underline;text-underline-offset:3px;font-size:12px;cursor:pointer}.result-help-details{background:#353535;border-radius:10px;padding:12px;margin-top:12px;color:#EEE;font-size:12px;line-height:1.6}.help-message{margin-top:12px;padding:12px 14px;border:1px solid rgba(255,255,255,.22);border-radius:12px;color:#eee;font-size:13px;line-height:1.5;text-align:left}.help-contact{margin-top:12px;display:block;text-align:center}.help-hint{margin-top:8px}</style></head><body><main id="app"></main><script>
(()=>{'use strict';const d=window.KK_DATA;document.documentElement.style.setProperty('--bg',d.bg);document.documentElement.style.setProperty('--gold',d.accent);const tg=window.Telegram&&window.Telegram.WebApp;const inside=/tgWebApp/i.test(location.hash+location.search)||!!window.TelegramWebviewProxy||!!(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.performAction);if(inside&&tg){try{tg.ready();tg.expand();tg.setHeaderColor(d.bg);tg.setBackgroundColor(d.bg)}catch(e){}}function event(name,data){try{if(window.TelegramWebviewProxy?.postEvent){window.TelegramWebviewProxy.postEvent(name,JSON.stringify(data||{}));return}if(window.webkit?.messageHandlers?.performAction){window.webkit.messageHandlers.performAction.postMessage({eventName:name,eventData:JSON.stringify(data||{})})}}catch(e){}}function go(url){if(!url)return;if(!inside){window.open(url,'_blank','noopener');return}if(url.startsWith('https://t.me/')){if(tg){try{tg.close();tg.openTelegramLink(url);return}catch(e){}}event('web_app_close',{});event('web_app_open_tg_link',{path_full:url.slice('https://t.me'.length)});return}if(tg){try{tg.openLink(url);return}catch(e){}}event('web_app_open_link',{url})}const $=(tag,cls,txt)=>{const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x};const app=document.getElementById('app');const header=$('header');const photo=$('img','portrait');photo.src=d.photo;photo.alt=d.name;header.append(photo,$('div','eyebrow',d.brand),$('h1','name',d.name),$('p','role',d.role));app.append(header);app.append($('section','panel about',d.about));const panel=$('section','panel');panel.append($('div','eyebrow','БЫСТРАЯ ПРОВЕРКА'),(()=>{const h=$('h2','section-title');const phrase='ЗАБРАТЬ ДЕНЬГИ';const pos=d.quizTitle.indexOf(phrase);if(pos<0){h.textContent=d.quizTitle}else{h.append(document.createTextNode(d.quizTitle.slice(0,pos)));const emphasis=$('span','title-emphasis',phrase);h.append(emphasis,document.createTextNode(d
